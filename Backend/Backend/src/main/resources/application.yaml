spring:
  application:
    name: Backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/simulation_db}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  session:
    cookie:
      same-site: none
      # Set to true if serving over HTTPS (production/Atlas). Keep false for plain HTTP dev.
      secure: ${SESSION_COOKIE_SECURE:false}
      http-only: true

server:
  port: ${PORT:8080}

# CORS_ALLOWED_ORIGINS: comma-separated list of allowed frontend origins.
# Example: CORS_ALLOWED_ORIGINS=http://192.168.1.50:5173,http://localhost:5173
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
